# One-off: copies the production database into a new, EMPTY one (the move from N. Virginia to
# Frankfurt, next to the API server). Started by hand only. Needs two repository secrets:
# OLD_DATABASE_URL (the current database) and NEW_DATABASE_URL (the new empty one). The old database is
# only read. See scripts/move-database.sh. Remove this workflow and both secrets after the move.
name: Перенос базы данных

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Кассы закрыты и сервер остановлен? Напишите: ДА"
        required: true

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ДА" ]; then
            echo "::error::Перенос не начат: в поле подтверждения нужно написать ДА"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Copy the database
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          docker run --rm -e OLD_DATABASE_URL -e NEW_DATABASE_URL \
            -v "$PWD/scripts:/scripts:ro" postgres:18 bash /scripts/move-database.sh
